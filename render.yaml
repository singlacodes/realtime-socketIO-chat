# Render Blueprint — adjust service names if needed
# https://render.com/docs/blueprint-spec

services:
  # Frontend static site
  - type: web
    name: realtime-socketio-chat-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # SPA fallback (do NOT rewrite real asset files)
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SERVER_URL
        # Your backend public URL
        value: https://realtime-socketio-chat.onrender.com

  # Backend API + Socket.IO
  - type: web
    name: realtime-socketio-chat
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://realtime-socketio-chat-mgz8.onrender.com
      - key: SERVER_URL
        value: https://realtime-socketio-chat.onrender.com
      # Set these in the Render dashboard (secrets):
      # MONGODB_URL, JWT_SECRET, CLOUD_NAME, API_KEY, API_SECRET
